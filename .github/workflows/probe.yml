name: 暫時測試資料來源
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/probe/save.py
      - run: |
          git config user.name bot; git config user.email bot@example.com
          git checkout -b probe-out
          git add -f probe-out && git commit -qm probe && git push -f origin probe-out
