name: 每週更新產業鏈（上下游）

on:
  schedule:
    # 每週日台灣時間 09:20（UTC 01:20）
    - cron: "20 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  chains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓產業價值鏈資訊平台
        run: python scripts/chains.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "產業鏈更新 $(date -u -d '+8 hours' +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          exit 1

  deploy:
    needs: chains
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
