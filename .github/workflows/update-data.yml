name: 每日更新股票資料

on:
  schedule:
    # 台灣時間週一到週五 17:40（UTC 09:40）。月營收、法人資料收盤後陸續公布。
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓資料並計算評分
        run: python scripts/build.py
      - name: 顯示各資料來源狀態
        if: always()
        run: cat data/fetch_log.json || true
      - name: 提交新資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資料更新 $(date -u -d '+8 hours' +%F)"
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
