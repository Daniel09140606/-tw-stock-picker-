name: 暫時測試 CORS
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" \
            "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?type=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/exchangeReport/STOCK_DAY_ALL?response=open_data" \
            "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes" \
            "https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&o=json" \
            "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw" ; do
            echo "== $u"
            curl -s -o /tmp/b -D - -H "Origin: https://daniel09140606.github.io" "$u" | grep -i -E "^HTTP|access-control|content-type|last-modified" || true
            head -c 300 /tmp/b; echo
          done
